services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: url-shortner-app

    working_dir: /var/www/html/data

    volumes:
      - .:/var/www/html

    depends_on:
      - mysql

    networks:
      - laravel

  nginx:
    image: nginx:1.28-alpine

    container_name: url-shortner-nginx

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - laravel

  mysql:
    image: mysql:8.4

    container_name: url-shortner-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: url_shortner
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin:latest

    container_name: url-shortner-phpmyadmin

    restart: unless-stopped

    depends_on:
      - mysql

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 256M

    networks:
      - laravel

volumes:
  mysql_data:

networks:
  laravel:
    driver: bridge